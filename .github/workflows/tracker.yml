name: Kino tracker

on:
  schedule:
    - cron: "*/10 * * * *"   # har 10 daqiqada (GitHub ba'zan bir oz kechiktiradi)
  workflow_dispatch:          # qo'lda ishga tushirish tugmasi

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Saytni tekshirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py
      - name: Holatni saqlash
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state yangilandi"
            git push
          fi
